name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate missing platform folders (android/ios) if absent
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.kelimehafiza --project-name kelime_hafiza .
          fi

      - name: Patch Kotlin/Android SDK versions (fixes known CI build-tools mismatch)
        run: |
          echo "--- settings.gradle oncesi ---"
          cat android/settings.gradle 2>/dev/null || cat android/settings.gradle.kts 2>/dev/null
          for f in android/settings.gradle android/settings.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E 's/(org\.jetbrains\.kotlin\.android"? version "?)[0-9]+\.[0-9]+\.[0-9]+/\11.9.24/' "$f"
            fi
          done
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E 's/compileSdk( |=)flutter\.compileSdkVersion/compileSdk\g<1>34/' "$f"
              sed -i -E 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 34/' "$f"
              sed -i -E 's/targetSdk( |=)flutter\.targetSdkVersion/targetSdk\g<1>34/' "$f"
              sed -i -E 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 34/' "$f"
            fi
          done
          echo "--- settings.gradle sonrasi ---"
          cat android/settings.gradle 2>/dev/null || cat android/settings.gradle.kts 2>/dev/null

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kelime-hafiza-apk
          path: build/app/outputs/flutter-apk/app-release.apk
