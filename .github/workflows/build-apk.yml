name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check
        run: |
          pwd
          ls -la
          head -10 lib/main.dart
          grep -q "KelimeHafizaApp" lib/main.dart || (echo "HATA: yanlis kod" && exit 1)
          echo "OK"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate android folder
        run: |
          if [ ! -d "android" ]; then
            TMP_SCAFFOLD=$(mktemp -d)
            flutter create --platforms=android --org com.kelimehafiza --project-name kelime_hafiza "$TMP_SCAFFOLD/scaffold"
            cp -r "$TMP_SCAFFOLD/scaffold/android" ./android
            rm -rf "$TMP_SCAFFOLD"
          fi

      - name: AGP 9 fix
        run: |
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.builtInKotlin=false" >> android/gradle.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kelime-hafiza-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
