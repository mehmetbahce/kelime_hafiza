name: kelime_hafiza
description: Melih Duyar tarzı kelime çağrışım kartları - hafıza uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.1.0
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  flutter_card_swiper: ^7.0.1
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
